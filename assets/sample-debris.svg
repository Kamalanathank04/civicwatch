<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" fill="#e2e8f0"/>
  <!-- Sidewalk paving -->
  <rect x="0" y="140" width="400" height="120" fill="#cbd5e1"/>
  <line x1="0" y1="180" x2="400" y2="180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="0" y1="220" x2="400" y2="220" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
  <!-- Wall in background -->
  <rect x="0" y="30" width="400" height="110" fill="#f8fafc" stroke="#cbd5e1"/>
  <!-- Broken concrete debris mound -->
  <polygon points="120,160 170,95 240,110 280,160 210,175" fill="#64748b"/>
  <polygon points="160,110 200,90 220,120 180,135" fill="#94a3b8"/>
  <polygon points="210,130 260,115 270,150 220,160" fill="#475569"/>
  <!-- Broken bricks / tiles -->
  <rect x="140" y="150" width="24" height="14" fill="#b91c1c" transform="rotate(25 140 150)"/>
  <rect x="230" y="155" width="20" height="12" fill="#c2410c" transform="rotate(-15 230 155)"/>
  <rect x="185" y="160" width="28" height="15" fill="#9a3412" transform="rotate(8 185 160)"/>
  <!-- Badge -->
  <rect x="15" y="15" width="170" height="26" rx="4" fill="#1e293b"/>
  <text x="25" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">PHOTO EVIDENCE #CW-1019</text>
  <text x="15" y="248" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Location: Gandhi Nagar 1st Main Rd</text>
</svg>