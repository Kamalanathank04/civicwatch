<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg1)"/>
  <rect x="0" y="210" width="400" height="50" fill="#94a3b8"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#64748b" stroke-width="3"/>
  <!-- Street Curb -->
  <rect x="0" y="215" width="400" height="6" fill="#cbd5e1"/>
  <!-- Bin 1 -->
  <path d="M 120 120 L 140 210 L 210 210 L 230 120 Z" fill="#0f766e" stroke="#134e4a" stroke-width="3"/>
  <rect x="110" y="112" width="130" height="12" rx="3" fill="#115e59"/>
