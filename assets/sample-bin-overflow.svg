  <ellipse cx="150" cy="105" rx="22" ry="16" fill="#334155"/>
  <ellipse cx="190" cy="98" rx="26" ry="18" fill="#475569"/>
  <ellipse cx="170" cy="85" rx="18" ry="14" fill="#64748b"/>
  <!-- Spilled items on ground -->
  <rect x="235" y="195" width="22" height="15" rx="2" fill="#e11d48" transform="rotate(15 235 195)"/>
  <circle cx="270" cy="204" r="8" fill="#0284c7"/>
  <polygon points="100,205 115,198 118,208" fill="#ea580c"/>
  <!-- Badge -->
  <rect x="15" y="15" width="170" height="26" rx="4" fill="#1e293b"/>
  <text x="25" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">PHOTO EVIDENCE #CW-1041</text>
  <text x="15" y="248" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Location: 2nd Avenue, Adyar Depot</text>
</svg>